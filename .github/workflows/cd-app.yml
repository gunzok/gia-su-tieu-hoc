# CD cho app: mỗi lần gộp vào main và CI xanh thì gửi cập nhật OTA (EAS Update) lên nhánh `preview` (chỉ máy thử nhận).
# OTA cho người dùng thật (APK cài từ GitHub Release, kênh `production`) KHÔNG tự gửi: chạy tay
# Actions > CD - App (OTA) > Run workflow > kenh = production, rồi chủ dự án duyệt environment `production` (GIA-79).
# Chỉ đổi mã JS/TS, ảnh, chữ mới đi OTA được. Thay đổi mã gốc (thư viện native, plugin, quyền, app.json)
# phải nâng version rồi build lại: xem eas-build.yml và docs/ci-cd.md.
name: CD - App (OTA)

on:
  push:
    branches: [main]
    # Chỉ ghi file KHÔNG vào bundle OTA. Thêm file vào đây thì kiểm lại bảng trigger ở docs/ci-cd.md.
    # Đổi riêng workflow (.github/**) không tự gửi OTA: cần thì Actions → CD - App (OTA) → Run workflow.
    paths-ignore:
      - "docs/**"
      - "supabase/**"
      - ".claude/**"
      - ".agent/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/**"
      - "Makefile"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      kenh:
        description: "Kênh nhận OTA: preview (máy thử) hoặc production (người dùng APK, phải duyệt)"
        type: choice
        default: preview
        options: [preview, production]
      ghi_chu:
        description: "Ghi chú cho bản OTA production (ba mẹ không thấy, để tra cứu)"
        type: string
        default: ""

# Không huỷ lượt đang chạy: để các bản OTA lần lượt theo thứ tự commit.
concurrency:
  group: cd-app-ota
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read # gitleaks đọc danh sách commit của PR

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  ota:
    name: Gửi cập nhật OTA (preview)
    needs: ci
    # Chạy tay trên nhánh khác sẽ không được gửi OTA. Chạy tay chọn kênh production thì đi job ota-production.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.kenh == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: eas update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Lấy dòng đầu của commit làm ghi chú; truyền qua biến môi trường để tránh chèn lệnh.
          VERSION=$(node -p "require('./app.json').expo.version")
          NOTE=$(printf '%s' "${COMMIT_MESSAGE:-manual}" | head -n1 | cut -c1-120)
          eas update --branch preview --environment preview --non-interactive \
            --message "GiaSuTieuHoc_${VERSION} (${GITHUB_SHA::7}): ${NOTE}"

  ota-production:
    name: Gửi cập nhật OTA (production, chờ duyệt)
    needs: ci
    if: github.event_name == 'workflow_dispatch' && inputs.kenh == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cổng duyệt: environment `production` có Required reviewers (chủ dự án).
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: eas update (kênh production)
        env:
          GHI_CHU: ${{ inputs.ghi_chu }}
        run: |
          # runtimeVersion theo version app: bản OTA chỉ tới máy đang cài APK cùng version (vd 0.5.0).
          # --channel: gửi lên nhánh mà kênh production đang trỏ tới (kênh có sau lần build APK đầu tiên).
          VERSION=$(node -p "require('./app.json').expo.version")
          NOTE=$(printf '%s' "${GHI_CHU:-manual}" | head -n1 | cut -c1-120)
          eas update --channel production --environment production --non-interactive \
            --message "GiaSuTieuHoc_${VERSION} (${GITHUB_SHA::7}): ${NOTE}"
