# CD cho máy chủ: khi gộp vào main có đổi thư mục supabase/ thì đẩy migration rồi deploy Edge Functions.
# Job chạy ở environment `production` nên có thể bật "Required reviewers" để chủ dự án bấm duyệt trước khi động vào database thật.
name: CD - Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/cd-supabase.yml"
  workflow_dispatch:

concurrency:
  group: cd-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy Supabase
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Liên kết dự án
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Xem trước migration sắp đẩy
        run: supabase db push --dry-run
      - name: Đẩy migration
        run: supabase db push
      - name: Deploy Edge Functions
        run: supabase functions deploy
      # Khoá bí mật (ANTHROPIC_API_KEY, REVENUECAT_SECRET_KEY, ...) KHÔNG đi qua CI:
      # chủ dự án tự đặt bằng `npx supabase secrets set`.
