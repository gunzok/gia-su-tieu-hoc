# CD cho máy chủ: khi gộp vào main có đổi thư mục supabase/ thì đẩy migration rồi deploy Edge Functions.
# Luồng: CI -> xem trước (dry-run, hiện trong Summary) -> chờ duyệt ở environment `production` -> đẩy migration + deploy hàm.
name: CD - Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/cd-supabase.yml"
  workflow_dispatch:

concurrency:
  group: cd-supabase
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read # gitleaks đọc danh sách commit của PR

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Chỉ triển khai từ main (chạy tay trên nhánh khác sẽ bị bỏ qua).
  # Bước xem trước chạy TRƯỚC cổng duyệt để người duyệt đọc được kế hoạch trong Summary của lượt chạy.
  plan:
    name: Xem trước migration (dry-run)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0 # ghim bản đã thử; đổi bản thì thử lại dry-run (CLI 3.x mặc định nhắm database máy cục bộ)
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: db push --dry-run
        run: |
          set -o pipefail
          # --remote: nhắm dự án đã link (CLI 3.x mặc định là database máy cục bộ). pipefail để lỗi không bị tee che mất.
          supabase db push --dry-run --remote 2>&1 | tee "$RUNNER_TEMP/plan.txt"
      - name: Ghi kế hoạch vào Summary
        if: always()
        run: |
          {
            echo '## Migration sắp đẩy lên production'
            echo '```'
            cat "$RUNNER_TEMP/plan.txt" 2>/dev/null || echo '(không có kết quả)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Supabase
    needs: [ci, plan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Cổng duyệt (Required reviewers) nằm ở đây: duyệt xong mới đụng vào database thật.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0 # ghim bản đã thử; đổi bản thì thử lại dry-run (CLI 3.x mặc định nhắm database máy cục bộ)
      - name: Liên kết dự án
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Đẩy migration
        # --yes: CLI 3.x đòi cờ này khi ghi lên máy chủ thật mà không có người gõ xác nhận. Job này đã có cổng duyệt (production).
        run: supabase db push --remote --yes
      - name: Deploy Edge Functions
        run: supabase functions deploy --yes
      # Khoá bí mật (ANTHROPIC_API_KEY, REVENUECAT_SECRET_KEY, ...) KHÔNG đi qua CI:
      # chủ dự án tự đặt bằng `npx supabase secrets set`.
