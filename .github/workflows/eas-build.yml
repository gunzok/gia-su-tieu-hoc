# Build app bằng EAS (chạy trên máy chủ Expo, không tốn phút runner) và phát hành khi gắn tag vX.Y.Z.
#  - Chạy tay (Actions > EAS Build > Run workflow): chọn profile và nền tảng.
#  - Gắn tag v0.5.0: kiểm tra khớp version trong app.json, build Android production, tạo GitHub Release.
# iOS thật cần tài khoản Apple Developer (chưa có): hiện chỉ build được iOS cho máy giả lập (profile preview-simulator).
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile trong eas.json"
        type: choice
        default: preview
        options: [preview, development, production, preview-simulator]
      platform:
        description: "Nền tảng (preview-simulator chỉ dùng được với ios)"
        type: choice
        default: android
        options: [android, ios]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build EAS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_type == 'tag' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag phải khớp version trong app.json
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} không khớp version app.json (${VERSION}). Dùng: npm run version:set -- x.y.z"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: eas build
        env:
          PROFILE: ${{ github.ref_type == 'tag' && 'production' || inputs.profile }}
          PLATFORM: ${{ github.ref_type == 'tag' && 'android' || inputs.platform }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          # --no-wait: máy chủ Expo tự build, workflow không đứng chờ. Link bản build có trong log và trên expo.dev.
          eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait \
            --message "GiaSuTieuHoc_${VERSION} (${PROFILE}, ${GITHUB_SHA::7})"

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tạo release kèm ghi chú tự động
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
